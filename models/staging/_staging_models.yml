version: 2


models:


  - name: stg_customers
    columns:


      - name: customer_id
        tests:
          - not_null
          - unique


      - name: email
        tests:
          - not_null




  - name: stg_orders
    columns:


      - name: order_id
        tests:
          - not_null
          - unique


      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id


      - name: status
        description: "Status of the order."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - completed
                  - pending
              config:
                severity: warn
                warn_if: "> 0"




  - name: stg_payments
    columns:


      - name: payment_id
        tests:
          - not_null
          - unique


      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id


      - name: payment_status
        tests:
          - not_null
