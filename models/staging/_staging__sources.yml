version: 2


sources:
  - name: ecommerce
    description: "Raw e-commerce source tables."


    schema: main


    tables:
      - name: raw_customers
        description: "Raw customer records."


      - name: raw_orders
        description: "Raw order records."
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: loaded_at


      - name: raw_payments
        description: "Raw payment records."
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: loaded_at
